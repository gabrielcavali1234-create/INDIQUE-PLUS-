<title>INDIQUE+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: app de bolso (460px) para indicador e corretor; painel largo para o admin. Fachada de janelas como motivo. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --ink:#10272E; --muted:#5A6D71; --line:#D5DEDB;
  --brand:#0F4C5C; --brand-2:#0B3A47; --brand-ink:#FFFFFF; --gold:#C98A12; --gold-soft:#FBEFD3; --danger:#B4362F; --danger-soft:#FBE4E2;
  --s0:#8A9799; --s1:#2F6FD6; --s2:#B89300; --s3:#DB7420; --s4:#7E4FC9; --s5:#2E87A8; --s6:#2E9B5F; --s7:#C98A12; --s8:#3B4446;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1618; --surface:#122326; --surface-2:#1A2F33; --ink:#E5EEEC; --muted:#92A6A8; --line:#25403F;
  --brand:#3A9DB0; --brand-2:#123A44; --brand-ink:#04161A; --gold:#E7B04A; --gold-soft:#372B12; --danger:#E46A62; --danger-soft:#3A1A18;
  --s0:#8E9C9E; --s1:#6C9BEB; --s2:#E0C14A; --s3:#EE9550; --s4:#A784E3; --s5:#5DB3D2; --s6:#5BC48A; --s7:#E7B04A; --s8:#9AA4A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1618; --surface:#122326; --surface-2:#1A2F33; --ink:#E5EEEC; --muted:#92A6A8; --line:#25403F;
  --brand:#3A9DB0; --brand-2:#123A44; --brand-ink:#04161A; --gold:#E7B04A; --gold-soft:#372B12; --danger:#E46A62; --danger-soft:#3A1A18;
  --s0:#8E9C9E; --s1:#6C9BEB; --s2:#E0C14A; --s3:#EE9550; --s4:#A784E3; --s5:#5DB3D2; --s6:#5BC48A; --s7:#E7B04A; --s8:#9AA4A6; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:460px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top-in.wide{max-width:1160px}
.brand{display:flex;align-items:center;gap:8px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.bn{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em}
.bn b{color:var(--gold)}
.roles{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.roles button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.roles button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.demo{max-width:460px;margin:0 auto;padding:6px 16px 0;font-size:12px;color:var(--muted)}
.demo.wide{max-width:1160px}

/* shell */
main{max-width:460px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
main.wide{max-width:1160px;padding-bottom:48px}
main.pro{padding-bottom:48px}

.hello h1{font-size:34px;font-weight:800;margin-top:4px}
.hello .sub{color:var(--muted);margin-top:4px}
.cta{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;border:0;border-radius:var(--r);padding:18px 20px;background:var(--brand);color:var(--brand-ink);position:relative;overflow:hidden}
.cta .ic{grid-row:span 2;width:44px;height:44px;padding:10px;border-radius:12px;background:var(--gold);color:#1B1305}
.cta span{font-family:var(--display);font-weight:700;font-size:20px}
.cta small{opacity:.8;font-size:13px}
.cta::after{content:"";position:absolute;right:-10px;top:0;bottom:0;width:120px;opacity:.12;
  background:repeating-linear-gradient(90deg,currentColor 0 10px,transparent 10px 18px),repeating-linear-gradient(0deg,transparent 0 6px,var(--brand) 6px 14px);background-blend-mode:normal}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.tile .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

.reward{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-soft);border-radius:14px;padding:14px 16px}
.reward .v{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.reward .l{font-size:13px;color:var(--muted)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;align-items:center;gap:10px;min-height:56px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-weight:600;text-align:left}
.qbtn .ic{color:var(--brand)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:19px}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:4px 0}

.principle{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);padding:12px 14px;border-radius:12px;border:1px dashed var(--line)}
.principle .ic{color:var(--brand);margin-top:1px}

/* list cards */
.cards{display:flex;flex-direction:column;gap:10px}
.icard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.icard .id{font-size:12px;color:var(--muted)}
.icard .who{font-weight:600}
.icard .where{font-size:13px;color:var(--muted);grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;align-self:start;
  color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* page header */
.ph{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ph h1{font-size:24px}

/* form */
form .card,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:17px}
.card h3{font-size:15px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--muted)}
.in{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px}
textarea.in{min-height:76px;resize:vertical}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qlabel{font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0}
.chips span{display:inline-flex;align-items:center;min-height:42px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:500}
.chips input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.chips input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.yn span{min-width:88px;justify-content:center}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;padding:14px;border-radius:12px;background:var(--surface-2)}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.err{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:15px}
.btn.big{width:100%;min-height:58px;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.btn.gold{background:var(--gold);color:#1B1305}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* result */
.result{text-align:center;padding:28px 18px;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .badge{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:var(--s6);color:#fff}
.result .badge.warn{background:var(--s3)}
.result h1{font-size:26px}
.idtag{font-family:var(--mono);font-weight:600;background:var(--surface-2);padding:6px 12px;border-radius:10px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl li::before{content:"";position:absolute;left:13px;top:24px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--sc)}
.tl .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1}
.tl li.done .n{background:var(--sc);border-color:var(--sc);color:#fff}
.tl li.cur .n{box-shadow:0 0 0 5px color-mix(in srgb,var(--sc) 22%,transparent)}
.tl .t{font-weight:600}
.tl li.todo .t{color:var(--muted);font-weight:500}
.tl .d{font-size:12.5px;color:var(--muted)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

/* wallet */
.wallet{background:var(--brand-2);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.wallet::after{content:"";position:absolute;inset:0 0 0 58%;opacity:.09;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 22px),repeating-linear-gradient(0deg,transparent 0 8px,var(--brand-2) 8px 18px)}
.wallet .l{font-size:13px;opacity:.8}
.wallet .v{font-family:var(--display);font-weight:800;font-size:40px;font-variant-numeric:tabular-nums;line-height:1.1}
.wsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{display:flex;flex-direction:column}
.hist > div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist > div:last-child{border-bottom:0}
.hist .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.tag.proc{background:color-mix(in srgb,var(--s1) 15%,transparent);color:var(--s1)}
.tag.disp{background:color-mix(in srgb,var(--s6) 15%,transparent);color:var(--s6)}
.tag.resg{background:color-mix(in srgb,var(--s4) 15%,transparent);color:var(--s4)}
.tag.pago{background:var(--surface-2);color:var(--muted)}

/* qr */
.qrbox{background:#fff;border-radius:18px;padding:16px;display:grid;place-items:center;width:212px;max-width:100%;margin:0 auto;border:1px solid var(--line)}
.qrbox img,.qrbox canvas{display:block}
.code{font-family:var(--mono);font-weight:600;font-size:24px;letter-spacing:.06em}
.copyrow{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 8px 8px 12px}
.copyrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:13px}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bottom .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0}
nav.bottom button.on{color:var(--brand)}
nav.bottom .mid .ic{width:48px;height:48px;padding:12px;border-radius:16px;background:var(--gold);color:#1B1305;margin-top:-18px;box-shadow:0 4px 14px rgb(0 0 0/.18)}

/* public page */
.pub-hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.pub-hero h1{font-size:28px;font-weight:800}
.pub-hero p{opacity:.85}

/* admin */
.atabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.atabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.atabs button.on{color:var(--ink);border-color:var(--gold)}
.atabs .cnt{font-size:11px;background:var(--danger);color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.fbar{height:26px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:7px;background:var(--sc)}
.frow b{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.rank{display:flex;flex-direction:column}
.rank > div{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.rank > div:last-child{border-bottom:0}
.rank .p{font-family:var(--mono);color:var(--muted);font-size:13px}
.alert{border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);background:var(--danger-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.note{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgb(5 15 18/.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0/.25)}
@media (prefers-reduced-motion:no-preference){
  #toast:not([hidden]){animation:up .25s ease-out}
  @keyframes up{from{transform:translate(-50%,8px);opacity:.4}}
}
@media (max-width:380px){.hello h1{font-size:28px}.frow{grid-template-columns:110px 1fr 36px}}
</style>

<div id="top"></div>
<main id="app"></main>
<div id="nav"></div>
<div id="modal"></div>
<div id="toast" role="status" hidden></div>

function setStatus(ind,to,who){
  if(ind.status===8||to===ind.status) return;
  ind.status=to; ind.hist.push({s:to,t:Date.now(),by:who});
  if(to>=3&&to!==8&&!S.rewards.find(r=>r.ind===ind.id)){
    const camp=S.campanhas.filter(c=>c.ativa&&new Date(c.ate+'T23:59')>Date.now()).reduce((a,c)=>a+Number(c.bonus||0),0);
    S.rewards.push({ind:ind.id,user:ind.user,v:S.cfg.valor+camp,estado:'processamento',t:Date.now()});
    log('Sistema',`Recompensa de ${money(S.cfg.valor+camp)} gerada para ${ind.id} (indicação qualificada)`);
  }
  if(to===8){const r=S.rewards.find(r=>r.ind===ind.id&&r.estado==='processamento'); if(r) r.estado='cancelada';}
  log(who,`${ind.id} → ${ST[to].l}`);
}
function findDup(phone,cid,unit){
  const p=dig(phone), u=normUnit(unit);
  return S.inds.find(i=>i.status!==8&&(dig(i.phone)===p||(i.condo===cid&&u&&normUnit(i.unit)===u)));
}
function createInd(d,origem){
  const dup=findDup(d.phone,d.condo,d.unit);
  if(dup){
    S.ocorr.unshift({t:Date.now(),user:d.user,owner:d.owner,phone:d.phone,unit:d.unit,condo:d.condo,match:dup.id,
      motivo:dig(dup.phone)===dig(d.phone)?'Telefone já cadastrado':'Imóvel já cadastrado',estado:'aberta'});
    log('Sistema',`Duplicidade detectada: tentativa de ${user(d.user).nome} sobre ${dup.id}`);
    return null;
  }
  const ind={id:fmtId(S.seq++),status:0,hist:[{s:0,t:Date.now(),by:origem==='App do indicador'?'Indicador':'Proprietário via QR Code'}],origem,consent:Date.now(),...d};
  S.inds.push(ind); log(user(d.user).nome,`Nova indicação ${ind.id} (${origem})`);
  return ind;
}

  const top=S.users.map(u=>({u,n:I_.filter(i=>i.user===u.id).length,q:I_.filter(i=>i.user===u.id&&reached(i,3)).length})).sort((a,b)=>b.q-a.q||b.n-a.n);
  const byC=S.condos.map(c=>({c,n:I_.filter(i=>i.condo===c.id).length})).sort((a,b)=>b.n-a.n);
  const byR={};I_.forEach(i=>{const r=condo(i.condo).reg;byR[r]=(byR[r]||0)+1});

     <p class="note">Conversão indicação → venda: ${n?Math.round(fun[5][1]/n*100):0}%</p></div>
    <div class="card"><h2>Financeiro do programa</h2><div class="kpis" style="grid-template-columns:1fr 1fr">
     ${kpi(money(sum(()=>true)),'Recompensas geradas')}${kpi(money(sum(r=>['processamento','disponivel','resgate'].includes(r.estado))),'Pendentes')}${kpi(money(sum(r=>r.estado==='pago')),'Pagas')}${kpi(R.length,'Recompensas emitidas')}</div>

   </div>`;
}

   <form data-f="rede" class="card" novalidate><h2>Rede de indicadores</h2>
    <p class="note">Um único nível: indicador → profissional convidado → indicações do convidado. Sem ganhos sobre níveis abaixo.</p>
    <label class="f">Bônus por convidado que fizer a 1ª indicação qualificada (R$)<input class="in num" id="r-valor" name="valor" type="number" min="0" value="${S.cfg.redeValor}"></label>
    <label class="check"><input type="checkbox" id="r-jur" name="jur" ${S.cfg.redeJuridico?'checked':''}><span>Regra aprovada pela análise jurídica</span></label>
    <label class="toggle"><input type="checkbox" id="r-ativa" name="ativa" ${S.cfg.redeAtiva?'checked':''}>Ativar incentivo da rede</label>
    <button class="btn" type="submit">Salvar regra</button></form>
  </div>`;
}
function aAud(){return `<div class="tbl-wrap"><table><thead><tr><th>Data e hora</th><th>Quem</th><th>Ação</th></tr></thead><tbody>${S.log.map(l=>`<tr><td class="num">${fdt(l.t)}</td><td>${esc(l.who)}</td><td>${esc(l.a)}</td></tr>`).join('')}</tbody></table></div>`}

/* ---------- render ---------- */
function render(){
  $('#top').innerHTML=vTop();
  const app=$('#app');
  app.className=S.role==='adm'?'wide':S.role==='pro'?'pro':'';
  if(S.role==='adm') app.innerHTML=vAdm();
  else if(S.role==='pro') app.innerHTML=vPro();
  else app.innerHTML=({home:vHome,nova:vNova,ok:vOk,dup:vDup,lista:vLista,det:vDet,carteira:vCarteira,mais:vMais,qr:vQR,convite:vConvite,privacidade:vPriv,termos:vTermos,login:vLogin,publico:vPublico}[S.tab]||vHome)();
  $('#nav').innerHTML=vNav();
  document.querySelectorAll('[data-qr]').forEach(el=>{el.innerHTML='';
    if(window.QRCode) new QRCode(el,{text:el.dataset.qr,width:180,height:180,colorDark:'#0B3A47',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    else el.textContent=el.dataset.qr;});
}
function go(t){S.tab=t;render();window.scrollTo(0,0)}

const act={
 role:d=>{S.role=d.v;if(d.v==='ind'&&['publico','login'].includes(S.tab))S.tab='home';render();window.scrollTo(0,0)},
 go:d=>{if(d.v==='login'){S.loginStep=0}go(d.v)},
 det:d=>{S.det=d.v;go('det')},
 filter:d=>{S.filter=d.v;render()},
 atab:d=>{S.admTab=d.v;render()},
 adv:d=>{const i=S.inds.find(x=>x.id===d.v);setStatus(i,i.status+1,d.who);toast(`${i.id}: ${ST[i.status].l}`);render()},
 close:d=>{const i=S.inds.find(x=>x.id===d.v);setStatus(i,8,d.who);toast(`${i.id} encerrada`);render()},
 rew:d=>{const r=S.rewards.find(x=>x.ind===d.v);r.estado=d.e;log('Admin',`Recompensa de ${r.ind} → ${d.e==='pago'?'paga':'liberada'} (${money(r.v)})`);toast(d.e==='pago'?'Pagamento registrado':'Recompensa liberada');render()},
 ocorr:d=>{const o=S.ocorr[d.v];o.estado=d.e;log('Admin',`Ocorrência sobre ${o.match}: ${d.e==='mantida'?'registro original mantido':'marcada como suspeita'}`);render()},
 resgatar:()=>{const w=wallet(S.me);S.rewards.filter(r=>r.user===S.me&&r.estado==='disponivel').forEach(r=>r.estado='resgate');log(me().nome,`Resgate solicitado: ${money(w.disp)}`);toast(`Resgate de ${money(w.disp)} solicitado`);render()},
 copy:d=>{const done=()=>toast('Link copiado');try{navigator.clipboard.writeText(d.v).then(done,()=>toast('Selecione o link e copie manualmente'))}catch(e){toast('Selecione o link e copie manualmente')}},
 lgpd:d=>{log(me().nome,`Solicitação LGPD: ${d.v} de dados`);toast(`Pedido de ${d.v} registrado. Resposta em até 15 dias.`)},
 resend:()=>toast('Novo código enviado'),
 cqr:d=>{const c=condo(d.v);$('#modal').innerHTML=`<div class="modal" data-a="mclose"><div class="box" role="dialog" aria-label="QR do condomínio"><p class="eyebrow">QR Code do condomínio</p><h2>${esc(c.nome).toUpperCase()}</h2><div class="qrbox" data-qr="https://indiqueplus.app/k/${c.id}"></div><p class="note">Indicações feitas por este QR são registradas com origem neste condomínio.</p><button class="btn" data-a="mclose">Fechar</button></div></div>`;
   const el=$('#modal [data-qr]');if(window.QRCode)new QRCode(el,{text:el.dataset.qr,width:180,height:180,colorDark:'#0B3A47',colorLight:'#ffffff'});else el.textContent=el.dataset.qr;},
 mclose:(d,el,e)=>{if(e.target===el)$('#modal').innerHTML=''}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;act[a.dataset.a]?.(a.dataset,a,e)});
document.addEventListener('change',e=>{
  if(e.target.id==='f-samewa') $('#wa-wrap').hidden=e.target.checked;
  if(e.target.id==='f-condo') $('#addr').hidden=e.target.value!=='outro';
  if(e.target.id==='a-filter'){S.admFilter=e.target.value;render()}
  if(e.target.dataset.camp!==undefined){const c=S.campanhas[e.target.dataset.camp];c.ativa=e.target.checked;log('Admin',`Campanha “${c.nome}” ${c.ativa?'ativada':'pausada'}`)}
});
document.addEventListener('input',e=>{if(['f-phone','f-wa','p-phone'].includes(e.target.id)){const d=dig(e.target.value).slice(0,11);e.target.value=d.length>2?fph(d)||d:d}});

const forms={
 nova(fd){
  const g=k=>(fd.get(k)||'').toString().trim(), err=m=>{const e=$('#f-err');e.textContent=m;e.hidden=false;e.scrollIntoView({block:'center',behavior:'smooth'})};
  if(!g('owner')) return err('Informe o nome do proprietário.');
  if(dig(g('phone')).length<10) return err('Informe um telefone com DDD.');
  if(g('autorizou')!=='Sim') return err(g('autorizou')==='Não'?'Peça a autorização do proprietário antes de enviar. Sem ela, não podemos registrar o contato.':'Responda se o proprietário autorizou passar o contato.');
  if(!g('unit')) return err('Informe a unidade (ex.: Apto 82 · Bloco B).');
  if(g('condo')==='outro'&&!g('end')) return err('Informe o endereço do imóvel.');
  if(!fd.get('consent')) return err('Marque a confirmação de autorização do proprietário.');
  const ind=createInd({user:S.me,condo:g('condo'),owner:g('owner'),phone:dig(g('phone')),wa:fd.get('samewa')?dig(g('phone')):dig(g('wa')),horario:g('horario'),
    unit:g('condo')==='outro'?`${g('unit')} · ${g('end')}, ${g('numero')} – ${g('bairro')}, ${g('cidade')}`:g('unit'),tipo:g('tipo'),dorms:g('dorms'),interesse:g('interesse'),quando:g('quando'),como:g('como'),obs:g('obs')},'App do indicador');
  if(!ind) return go('dup');
  S.lastId=ind.id; go('ok');
 },
 publico(fd){
  const g=k=>(fd.get(k)||'').toString().trim(), err=m=>{const e=$('#p-err');e.textContent=m;e.hidden=false};
  if(!g('owner')||dig(g('phone')).length<10||!g('unit')) return err('Preencha nome, WhatsApp com DDD e unidade.');
  if(!fd.get('consent')) return err('Marque a autorização de contato para continuar.');
  const ind=createInd({user:S.me,condo:me().condo,owner:g('owner'),phone:dig(g('phone')),horario:'Qualquer horário',unit:g('unit'),tipo:'Apartamento',dorms:'—',interesse:'Sim',quando:'Esta semana',como:'O próprio proprietário',obs:''},`QR Code pessoal ${me().code}`);
  if(!ind){$('#app').innerHTML=`<div class="card result"><h1>Já temos o seu contato.</h1><p class="muted">Um profissional vai falar com você em breve.</p><button class="btn ghost" data-a="go" data-v="qr">Voltar ao app</button></div>`;return}
  $('#app').innerHTML=`<div class="card result"><div class="badge">${ic('check',36)}</div><h1>Recebemos seu contato!</h1><p class="muted">Um profissional imobiliário habilitado vai falar com você pelo WhatsApp.</p><span class="idtag">${ind.id}</span><button class="btn ghost" data-a="go" data-v="home">Voltar ao app do indicador</button></div>`;
 },
 login(fd){
  if(!S.loginStep){const v=(fd.get('id')||'').toString().trim();if(!v)return toast('Informe celular ou e-mail');S.loginTo=v;S.loginStep=1;render();return}
  if(dig(fd.get('code')).length!==6) return toast('O código tem 6 dígitos');
  log(me().nome,'Login com código de verificação');S.loginStep=0;go('home');toast('Bem-vindo de volta!');
 },
 condo(fd){const g=k=>(fd.get(k)||'').toString().trim();if(!g('nome'))return toast('Informe o nome do condomínio');
  const c={id:'c'+(S.condos.length+1)+Date.now()%1000,nome:g('nome'),end:g('end'),bairro:g('bairro'),cidade:g('cidade'),reg:g('reg')||'—'};S.condos.push(c);log('Admin',`Condomínio cadastrado: ${c.nome}`);render();act.cqr({v:c.id})},
 cfg(fd){const v=Math.max(0,Math.round(Number(fd.get('valor'))||0));log('Admin',`Valor da recompensa: ${money(S.cfg.valor)} → ${money(v)}`);S.cfg.valor=v;toast('Valor salvo');render()},
 camp(fd){const g=k=>(fd.get(k)||'').toString().trim();if(!g('nome'))return toast('Dê um nome à campanha');S.campanhas.push({nome:g('nome'),bonus:Number(g('bonus'))||0,ate:g('ate'),ativa:true});log('Admin',`Campanha criada: ${g('nome')}`);render()},
 rede(fd){const jur=!!fd.get('jur'),at=!!fd.get('ativa');if(at&&!jur)return toast('Ative só depois da aprovação jurídica');
  S.cfg.redeJuridico=jur;S.cfg.redeAtiva=at;S.cfg.redeValor=Number(fd.get('valor'))||0;log('Admin',`Regra da rede ${at?'ativada':'desativada'} (${money(S.cfg.redeValor)})`);toast('Regra salva');render()}
};
document.addEventListener('submit',e=>{e.preventDefault();forms[e.target.dataset.f]?.(new FormData(e.target),e.target)});
render();
</script>
