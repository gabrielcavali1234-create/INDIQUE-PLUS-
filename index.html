<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rendique: você conhece a oportunidade, nós cuidamos do resto.">
<meta name="theme-color" content="#1D3A5F">
<title>Rendique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%2712%27 y=%275%27 width=%2740%27 height=%2754%27 rx=%275%27 fill=%27%231D3A5F%27/%3E%3Crect x=%2719%27 y=%2713%27 width=%2710%27 height=%2710%27 rx=%272%27 fill=%27%23fff%27/%3E%3Crect x=%2735%27 y=%2713%27 width=%2710%27 height=%2710%27 rx=%272%27 fill=%27%23F5B83D%27/%3E%3Crect x=%2719%27 y=%2728%27 width=%2710%27 height=%2710%27 rx=%272%27 fill=%27%23fff%27/%3E%3Crect x=%2735%27 y=%2728%27 width=%2710%27 height=%2710%27 rx=%272%27 fill=%27%23fff%27/%3E%3Crect x=%2727%27 y=%2744%27 width=%2710%27 height=%2715%27 rx=%272%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de bolso (460px) para indicador e corretor; painel largo para o admin. Fachada de janelas como motivo. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E7EBF1; --ink:#15233A; --muted:#56637A; --line:#D6DCE5;
  --brand:#1D3A5F; --brand-2:#132840; --brand-ink:#FFFFFF; --gold:#F5B83D; --gold-soft:#FEF3D9; --danger:#B4362F; --danger-soft:#FBE4E2;
  --s0:#8A9799; --s1:#2F6FD6; --s2:#B89300; --s3:#DB7420; --s4:#7E4FC9; --s5:#2E87A8; --s6:#2E9B5F; --s7:#1E7A48; --s8:#3B4446; --lit:#F5B83D;
  --display:"Sora", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121B2B; --surface-2:#1A2538; --ink:#E6EBF2; --muted:#94A0B4; --line:#243049;
  --brand:#8DB0E3; --brand-2:#16263D; --brand-ink:#0B1220; --gold:#F5B83D; --gold-soft:#3A2E12; --danger:#E46A62; --danger-soft:#3A1A18;
  --s0:#8E9C9E; --s1:#6C9BEB; --s2:#E0C14A; --s3:#EE9550; --s4:#A784E3; --s5:#5DB3D2; --s6:#5BC48A; --s7:#4CC38A; --s8:#9AA4A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2B; --surface-2:#1A2538; --ink:#E6EBF2; --muted:#94A0B4; --line:#243049;
  --brand:#8DB0E3; --brand-2:#16263D; --brand-ink:#0B1220; --gold:#F5B83D; --gold-soft:#3A2E12; --danger:#E46A62; --danger-soft:#3A1A18;
  --s0:#8E9C9E; --s1:#6C9BEB; --s2:#E0C14A; --s3:#EE9550; --s4:#A784E3; --s5:#5DB3D2; --s6:#5BC48A; --s7:#4CC38A; --s8:#9AA4A6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:460px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top-in.wide{max-width:1240px}
.card .kpis .tile .v{font-size:22px}
.brand{display:flex;align-items:center;gap:8px}
.logo{display:block;flex:none}
.bn{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.04em}
.devsw{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.devsw button{border:0;background:none;width:34px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.devsw button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.roles{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.roles button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.roles button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.demo{max-width:460px;margin:0 auto;padding:6px 16px 0;font-size:12px;color:var(--muted)}
.demo.wide{max-width:1240px}

/* shell */
main{max-width:460px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
main.wide{max-width:1160px;padding-bottom:48px}
main.pro{padding-bottom:48px}

.hello h1{font-size:34px;font-weight:800;margin-top:4px}
.hello .sub{color:var(--muted);margin-top:4px}
.cta{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;border:0;border-radius:var(--r);padding:18px 20px;background:var(--brand);color:var(--brand-ink);position:relative;overflow:hidden}
.cta .ic{grid-row:span 2;width:44px;height:44px;padding:10px;border-radius:12px;background:var(--gold);color:#1B1305}
.cta span{font-family:var(--display);font-weight:700;font-size:20px}
.cta small{opacity:.8;font-size:13px}
.cta::after{content:"";position:absolute;right:-10px;top:0;bottom:0;width:120px;opacity:.12;
  background:repeating-linear-gradient(90deg,currentColor 0 10px,transparent 10px 18px),repeating-linear-gradient(0deg,transparent 0 6px,var(--brand) 6px 14px);background-blend-mode:normal}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.tile .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

.reward{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-soft);border-radius:14px;padding:14px 16px}
.reward .v{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.reward .l{font-size:13px;color:var(--muted)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;align-items:center;gap:10px;min-height:56px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-weight:600;text-align:left}
.qbtn .ic{color:var(--brand)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:19px}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:4px 0}

.principle{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);padding:12px 14px;border-radius:12px;border:1px dashed var(--line)}
.principle .ic{color:var(--brand);margin-top:1px}

/* list cards */
.cards{display:flex;flex-direction:column;gap:10px}
.icard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.icard .id{font-size:12px;color:var(--muted)}
.icard .who{font-weight:600}
.icard .where{font-size:13px;color:var(--muted);grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;align-self:start;
  color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* page header */
.ph{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ph h1{font-size:24px}

/* form */
form .card,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:17px}
.card h3{font-size:15px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--muted)}
.in{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px}
textarea.in{min-height:76px;resize:vertical}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qlabel{font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0}
.chips span{display:inline-flex;align-items:center;min-height:42px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:500}
.chips input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.chips input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.yn span{min-width:88px;justify-content:center}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;padding:14px;border-radius:12px;background:var(--surface-2)}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.err{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:15px}
.btn.big{width:100%;min-height:58px;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.btn.gold{background:var(--gold);color:#1B1305}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* result */
.result{text-align:center;padding:28px 18px;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .badge{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:var(--s6);color:#fff}
.result .badge.warn{background:var(--s3)}
.result h1{font-size:26px}
.idtag{font-family:var(--mono);font-weight:600;background:var(--surface-2);padding:6px 12px;border-radius:10px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl li::before{content:"";position:absolute;left:13px;top:24px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--sc)}
.tl .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1}
.tl li.done .n{background:var(--sc);border-color:var(--sc);color:#fff}
.tl li.cur .n{box-shadow:0 0 0 5px color-mix(in srgb,var(--sc) 22%,transparent)}
.tl .t{font-weight:600}
.tl li.todo .t{color:var(--muted);font-weight:500}
.tl .d{font-size:12.5px;color:var(--muted)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

/* wallet */
.wallet{background:var(--brand-2);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.wallet::after{content:"";position:absolute;inset:0 0 0 58%;opacity:.09;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 22px),repeating-linear-gradient(0deg,transparent 0 8px,var(--brand-2) 8px 18px)}
.wallet .l{font-size:13px;opacity:.8}
.wallet .v{font-family:var(--display);font-weight:800;font-size:40px;font-variant-numeric:tabular-nums;line-height:1.1}
.wsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{display:flex;flex-direction:column}
.hist > div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist > div:last-child{border-bottom:0}
.hist .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.tag.proc{background:color-mix(in srgb,var(--s1) 15%,transparent);color:var(--s1)}
.tag.disp{background:color-mix(in srgb,var(--s6) 15%,transparent);color:var(--s6)}
.tag.resg{background:color-mix(in srgb,var(--s4) 15%,transparent);color:var(--s4)}
.tag.pago{background:var(--surface-2);color:var(--muted)}

/* qr */
.qrbox{background:#fff;border-radius:18px;padding:16px;display:grid;place-items:center;width:212px;max-width:100%;margin:0 auto;border:1px solid var(--line)}
.qrbox img,.qrbox canvas{display:block}
.code{font-family:var(--mono);font-weight:600;font-size:24px;letter-spacing:.06em}
.copyrow{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 8px 8px 12px}
.copyrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:13px}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bottom .nav-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0}
nav.bottom button.on{color:var(--brand)}
nav.bottom .mid .ic{width:48px;height:48px;padding:12px;border-radius:16px;background:var(--gold);color:#1B1305;margin-top:-18px;box-shadow:0 4px 14px rgb(0 0 0/.18)}

/* public page */
.pub-hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.pub-hero h1{font-size:28px;font-weight:800}
.pub-hero p{opacity:.85}

/* admin */
.atabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.atabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.atabs button.on{color:var(--ink);border-color:var(--gold)}
.atabs .cnt{font-size:11px;background:var(--danger);color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.fbar{height:26px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:7px;background:var(--sc)}
.frow b{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.rank{display:flex;flex-direction:column}
.rank > div{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.rank > div:last-child{border-bottom:0}
.rank .p{font-family:var(--mono);color:var(--muted);font-size:13px}
.alert{border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);background:var(--danger-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.note{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}

/* layout helpers */
.col,.narrow,.hgrid,.split,.fgrid{display:flex;flex-direction:column;gap:16px;min-width:0}
main.adm{max-width:460px}

/* escolha de dispositivo */
main.choose{max-width:760px;min-height:100%;justify-content:center;padding-block:40px}
.choose-in{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.choose-in h1{font-size:30px;margin-top:12px}
.brand.big{gap:14px}
.brand.big .bn{font-size:40px}
.devgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;width:100%}
.devcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:22px;border-radius:20px;border:2px solid var(--line);background:var(--surface)}
.devcard:hover{border-color:var(--brand)}
.devcard .di{width:56px;height:56px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.devcard .dt{font-family:var(--display);font-weight:700;font-size:21px;display:flex;flex-direction:column;gap:6px}
.devcard .dt em{font-family:var(--body);font-style:normal;font-size:12px;font-weight:700;color:#1B1305;background:var(--gold);border-radius:999px;padding:2px 10px;align-self:flex-start}
.devcard .dd{color:var(--muted);font-size:14.5px}

/* versão computador */
@media (min-width:761px){
  [data-device="desk"] main{max-width:1240px;padding:28px 32px 56px}
  [data-device="desk"] main.wide{max-width:1240px}
  [data-device="desk"][data-side] main{margin-left:232px;max-width:1140px}
  [data-device="desk"][data-side] .top-in.wide{max-width:none;margin-left:0;padding-left:24px}
  [data-device="desk"][data-side] .demo.wide{max-width:none;margin-left:0;padding-left:264px}
  [data-device="desk"] nav.bottom{top:0;bottom:0;right:auto;width:232px;z-index:15;border-top:0;border-right:1px solid var(--line);padding:96px 12px 16px}
  [data-device="desk"] nav.bottom .nav-in{display:flex;flex-direction:column;align-items:stretch;gap:4px;max-width:none;margin:0}
  [data-device="desk"] nav.bottom button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 14px;border-radius:12px;color:var(--ink)}
  [data-device="desk"] nav.bottom button.on{background:var(--surface-2);color:var(--brand)}

.lc-sub{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.lc-act{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.iconbtn.wa,.btn.wa{color:#fff;background:#1F9D55;border-color:#1F9D55;text-decoration:none}
.kboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:var(--surface-2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.kcol header{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;padding:4px 4px 0}
.kcol .cnum{margin-left:auto;background:var(--surface)}
.kdot{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.kcards{display:flex;flex-direction:column;gap:8px}
.kcol .lcard{flex-direction:column;padding:12px}
.kcol .lc-act{flex-direction:row;align-items:center;justify-content:space-between}
.kempty{font-size:13px;color:var(--muted);padding:6px 4px}
.dwrap{position:fixed;inset:0;z-index:45;background:rgb(5 15 30/.35);display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgb(0 0 0/.18)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.db{overflow:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:22px}
.db h2{font-size:22px;margin-top:4px}
.nextbox{background:var(--surface-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.nextbox .link{color:var(--danger);align-self:center}
.paybox{display:flex;flex-direction:column;gap:6px;text-align:left}
.modal .box form .f{text-align:left}
.modal .box{max-height:calc(100% - 32px);overflow:auto}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slidein .2s ease-out}@keyframes slidein{from{transform:translateX(30px);opacity:.6}}}

.authtabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px}
.authtabs button{border:0;background:none;min-height:42px;border-radius:9px;font-weight:700;color:var(--muted)}
.authtabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.pw{position:relative;display:block}
.pw .in{padding-right:84px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;padding:8px}
body.busy{cursor:progress}
body.busy button,body.busy input[type=submit]{pointer-events:none;opacity:.7}
.logoutbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px}
.logoutbtn:hover{border-color:var(--danger);color:var(--danger)}
@media (max-width:480px){.who-chip{display:none}.logoutbtn span{display:none}.logoutbtn{width:40px;padding:0;justify-content:center}}
</style>
</head>
<body>
<div id="top"></div>
<main id="app"></main>
<div id="nav"></div>
<div id="bell"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="ftip" class="ftip" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js?v=202610062113"></script>
<script src="app.js?v=202610080230"></script>
</body>
</html>
